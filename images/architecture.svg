<svg xmlns="http://www.w3.org/2000/svg" width="900" height="435" viewBox="0 0 900 435" role="img" aria-labelledby="title desc">
<title id="title">Homelab logical architecture</title>
<desc id="desc">Public traffic reaches Caddy through Cloudflare Tunnel. The operator uses Tailscale and SSH. Pi-hole serves LAN clients. Server2 is behind a dedicated router. Local restic backups exist and the NAS copy is incomplete.</desc>
